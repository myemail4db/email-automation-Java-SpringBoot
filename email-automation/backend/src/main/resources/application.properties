# =========================================================
# Spring Boot Configuration
# =========================================================

spring.application.name=email-automation
spring.config.import=optional:classpath:application-private.properties

server.port=8080


# =========================================================
# Spring Boot Logging
# =========================================================

logging.level.root=INFO
logging.level.com.example.email_automation=DEBUG
logging.file.name=logs/email-automation.log


# =========================================================
# Application Configuration
# =========================================================


# ---------------------------------------------------------
# Gmail Workflow Labels
# ---------------------------------------------------------

email.gmail.source-label=for_friend
email.gmail.success-label=for_friend/processed_review
email.gmail.fail-label=for_friend/error


# ---------------------------------------------------------
# Local File Directories
# ---------------------------------------------------------

email.files.processed-dir=processed_review
email.files.archive-dir=sent_archive
email.files.error-dir=error


# ---------------------------------------------------------
# ZIP Export Configuration
# ---------------------------------------------------------

email.files.zip-dir=ready_to_send
email.files.zip-prefix=job_batch


# ---------------------------------------------------------
# Email Export
# ---------------------------------------------------------

email.export.default-format=text
